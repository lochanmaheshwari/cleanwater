<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're live — savewater.tech</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<meta property="og:title" content="savewater.tech — I donated to clean water">
<meta property="og:description" content="Pay-to-rank leaderboard where 75% of bids fund clean water.">
</head>
<body>
<header class="topbar"><a class="logo" href="index.html"><span class="logo-mark">≋</span> savewater.tech</a></header>
<main style="max-width:560px;margin:40px auto;padding:0 20px;text-align:center">
  <div id="card" style="background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(16,23,28,.08)">
    <div id="logoWrap" style="width:120px;height:120px;margin:0 auto;border-radius:16px;background:var(--accent-xxlo);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--accent);font-size:28px"></div>
    <h1 style="font-size:28px;font-weight:800;margin:14px 0 6px">You donated <span id="amount">$--</span> to clean water.</h1>
    <p style="color:var(--muted)"><span id="rank">You're on the board</span></p>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
      <a id="shareBtn" class="btn-accent" href="#" target="_blank">Share</a>
      <a href="index.html" style="border:1px solid var(--border);background:#fff;border-radius:999px;padding:12px 18px;font-weight:600;text-decoration:none;color:var(--ink)">View leaderboard</a>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:12px">Receipt from Every.org. Rank updates live.</p>
  </div>
  <canvas id="ogCanvas" width="1200" height="630" style="display:none"></canvas>
</main>
<script type="module">
import { getLogoUrl, esc } from './js/utils.js';

const id=new URLSearchParams(location.search).get('id');
async function load(){
  if(!id) return;
  const r=await fetch(`/api/check-status?id=${encodeURIComponent(id)}`);
  const j=await r.json().catch(()=>({}));
  const entry=j.entry || j;
  const amount = entry.donated_cents 
    ? (entry.donated_cents/100).toFixed(0) 
    : (entry.total_bid_cents ? Math.round(entry.total_bid_cents * 0.75 / 100).toFixed(0) : '7.50');
  document.getElementById('amount').textContent='$'+amount;
  if(entry.logo_path){
    const logo=document.getElementById('logoWrap');
    const url=getLogoUrl(entry.logo_path);
    logo.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
  }
  // rank: fetch leaderboard
  try{
    const lb=await fetch(`https://ecvumloyecjefvryjgaf.supabase.co/rest/v1/entries?select=id,total_bid_cents,first_bid_at&status=eq.live&order=total_bid_cents.desc&order=first_bid_at.asc`,{headers:{apikey: document.querySelector('link')?'':''}}).then(r=>r.json()).catch(()=>null);
  }catch{}
  document.getElementById('rank').textContent = entry.status==='live' ? `You're live — ${entry.category||''}` : `Status: ${entry.status}`;
  // share: generate OG via canvas
  const btn=document.getElementById('shareBtn');
  const canvas=document.getElementById('ogCanvas');
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#FBFDFE'; ctx.fillRect(0,0,1200,630);
  ctx.fillStyle='#1B7FA8'; ctx.font='700 64px Outfit'; ctx.fillText('cleanwater.lol', 60, 100);
  ctx.fillStyle='#10171C'; ctx.font='800 72px Outfit'; ctx.fillText(`$${amount} to clean water`, 60, 300);
  ctx.fillStyle='#7A8A93'; ctx.font='500 32px Outfit'; ctx.fillText(entry.display_name||entry.destination||'', 60, 360);
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    btn.href=url; btn.download='cleanwater-share.png';
    btn.textContent='Download share image';
    btn.onclick=()=>{ window.open(url,'_blank'); return false; };
  });
}
load();
</script>
</body>
</html>
