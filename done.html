<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230284c7' d='M16 3C16 3 6 15.5 6 21.5a10 10 0 0 0 20 0C26 15.5 16 3 16 3z'/%3E%3Cpath fill='%2338bdf8' d='M16 7.5C16 7.5 9 16.5 9 21.5a7 7 0 0 0 14 0C23 16.5 16 7.5 16 7.5z' opacity='.7'/%3E%3C/svg%3E">
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
  (function(){
    try {
      var t = localStorage.getItem('cww-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (t === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch(e) {}
  })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>You're live — savewater.tech</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<meta property="og:title" content="savewater.tech — I donated to clean water">
<meta property="og:description" content="Pay-to-rank leaderboard where 75% of bids fund clean water.">

</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="logo" href="index.html">
      <span class="logo-icon">≋</span>
      savewater.tech
    </a>
  </div>
  <nav class="nav">
    <a href="index.html" class="desktop-nav-link">Leaderboard</a>
    <a href="donations.html" class="desktop-nav-link">Donations</a>
    <a href="water.html" class="desktop-nav-link">Where Am I Donating?</a>
    <a href="about.html" class="desktop-nav-link">About</a>
    <a href="index.html#submitForm" class="nav-outbid-btn">+ Outbid</a>
    <button id="darkToggle" class="icon-btn" aria-label="toggle dark mode">☾</button>
  </nav>
</header>
<main style="max-width:560px;margin:40px auto;padding:0 20px;text-align:center">
  <div id="card" style="background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--card-shadow)">
    <div id="logoWrap" style="width:120px;height:120px;margin:0 auto;border-radius:16px;background:var(--accent-light);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--accent);font-size:28px"></div>
    <h1 style="font-size:28px;font-weight:800;margin:14px 0 6px">You donated <span id="amount">$--</span> to clean water.</h1>
    <p style="color:var(--muted)"><span id="rank">You're on the board</span></p>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
      <a id="shareBtn" class="btn-accent" href="#" target="_blank">Share</a>
      <a href="index.html" style="border:1px solid var(--border);background:var(--card-bg);border-radius:999px;padding:12px 18px;font-weight:600;text-decoration:none;color:var(--ink)">View leaderboard</a>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:12px">Receipt from Every.org. Rank updates live.</p>
  </div>
  <canvas id="ogCanvas" width="1200" height="630" style="display:none"></canvas>
</main>
<script type="module">
import { getLogoUrl, esc } from './js/utils.js';
import './js/theme.js';

const id = new URLSearchParams(location.search).get('id');
async function load() {
  if (!id) return;
  try {
    const r = await fetch(`/api/check-status?id=${encodeURIComponent(id)}`);
    const j = await r.json().catch(() => ({}));
    const entry = j.entry || j;
    if (!entry) return;

    const amount = entry.donated_cents 
      ? (entry.donated_cents / 100).toFixed(0) 
      : (entry.total_bid_cents ? Math.round(entry.total_bid_cents * 0.75 / 100).toFixed(0) : '7.50');
    
    const amtEl = document.getElementById('amount');
    if (amtEl) amtEl.textContent = '$' + amount;

    if (entry.logo_path) {
      const logo = document.getElementById('logoWrap');
      const url = getLogoUrl(entry.logo_path);
      if (logo) logo.innerHTML = `<img src="${esc(url)}" alt="logo" style="width:100%;height:100%;object-fit:cover">`;
    }

    const rankEl = document.getElementById('rank');
    if (rankEl) {
      rankEl.textContent = entry.status === 'live' ? `You're live — ${entry.category || ''}` : `Status: ${entry.status}`;
    }

    // Share image canvas generator
    try {
      const btn = document.getElementById('shareBtn');
      const canvas = document.getElementById('ogCanvas');
      if (btn && canvas) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FBFDFE';
        ctx.fillRect(0, 0, 1200, 630);
        ctx.fillStyle = '#1B7FA8';
        ctx.font = '700 64px Outfit';
        ctx.fillText('cleanwater.lol', 60, 100);
        ctx.fillStyle = '#10171C';
        ctx.font = '800 72px Outfit';
        ctx.fillText(`$${amount} to clean water`, 60, 300);
        ctx.fillStyle = '#7A8A93';
        ctx.font = '500 32px Outfit';
        ctx.fillText(entry.display_name || entry.destination || '', 60, 360);
        canvas.toBlob(blob => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          btn.href = url;
          btn.download = 'cleanwater-share.png';
          btn.textContent = 'Download share image';
          btn.onclick = () => { window.open(url, '_blank'); return false; };
        });
      }
    } catch (canvasErr) {
      console.warn('canvas share generation error', canvasErr);
    }
  } catch (err) {
    console.error('done.html load error', err);
  }
}
load();
</script>
</body>
</html>
