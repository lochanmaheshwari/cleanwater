<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230284c7' d='M16 3C16 3 6 15.5 6 21.5a10 10 0 0 0 20 0C26 15.5 16 3 16 3z'/%3E%3Cpath fill='%2338bdf8' d='M16 7.5C16 7.5 9 16.5 9 21.5a7 7 0 0 0 14 0C23 16.5 16 7.5 16 7.5z' opacity='.7'/%3E%3C/svg%3E">
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
  (function(){
    try {
      var t = localStorage.getItem('cww-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (t === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch(e) {}
  })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Categories — savewater.tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script
  defer
  data-website-id="dfid_2JrT0k7V5jfOILDkr0dj6"
  data-domain="savewater.tech"
  src="https://datafa.st/js/script.js">
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="logo" href="index.html">
      <span class="logo-icon">≋</span>
      savewater.tech
    </a>
  </div>
  <nav class="nav">
    <a href="index.html" class="desktop-nav-link">Leaderboard</a>
    <a href="donations.html" class="desktop-nav-link">Donations</a>
    <a href="about.html" class="desktop-nav-link">About</a>
    <a href="index.html#submitForm" class="nav-outbid-btn">+ Outbid</a>
    <button id="darkToggle" class="icon-btn" aria-label="toggle dark mode">☾</button>
  </nav>
</header>

<div class="mobile-subnav">
  <a href="index.html">Leaderboard</a>
  <a href="donations.html">Donations</a>
  <a href="about.html">About</a>
</div>

<main style="max-width:1080px;margin:28px auto;padding:0 20px">
  <h1 style="font-size:32px;font-weight:800">Categories</h1>
  <div id="chips" class="cat-row" style="padding:0"></div>
  <div id="board" class="board" style="padding:0"></div>
  <div id="loading" class="loading">loading…</div>
</main>
<script type="module">
import {CONFIG} from './js/config.js';
import {getSupabase} from './js/supabase.js';
import {formatMoney,formatMoney2,esc,timeAgo,getLogoUrl} from './js/utils.js';
import './js/theme.js';
let cat = new URLSearchParams(location.search).get('slug') || 'all';
function renderChips(){
  const el=document.getElementById('chips');
  el.innerHTML=['all',...CONFIG.CATEGORIES].map(c=>`<button class="cat-chip ${c===cat?'active':''}" data-c="${esc(c)}">${esc(c==='all'?'All':c)}</button>`).join('');
  el.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.c; history.replaceState(null,'','?slug='+encodeURIComponent(cat)); renderChips(); load();}));
}
async function load(){
  const board=document.getElementById('board');
  const loading=document.getElementById('loading');
  loading.style.display='block'; board.innerHTML='';
  try{
    const sb=await getSupabase();
    let q=sb.from('entries').select('*').eq('status','live').order('total_bid_cents',{ascending:false});
    if(cat!=='all') q=q.eq('category',cat);
    const {data,error}=await q;
    if(error) throw error;
    loading.style.display='none';
    if(!data||!data.length){ board.innerHTML='<div class="empty">no listings in this category yet.</div>'; return; }
    board.innerHTML=data.map((e,i)=>`
      <div class="card card-4-10">
        <div class="rank-badge">#${i+1}</div>
        <div class="logo-wrap" style="width:72px;height:72px">${e.logo_path ? `<img src="${esc(getLogoUrl(e.logo_path))}" alt="${esc(e.display_name)}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">` : esc((e.display_name||'?').slice(0,2).toUpperCase())}</div>
        <div class="card-body"><div class="card-title">${esc(e.display_name)}</div><div class="card-blurb">${esc(e.description||'')}</div><div class="card-meta">${esc(timeAgo(e.last_bid_at))} · ${esc(e.destination)}</div></div>
        <div class="card-right"><div class="bid">${formatMoney(e.total_bid_cents)}</div><div class="donated">${formatMoney2(e.donated_cents||Math.round(e.total_bid_cents*0.75))} to water</div></div>
      </div>
    `).join('');
  }catch(e){ loading.style.display='none'; board.innerHTML='<div class="error">'+esc(e.message)+'</div>'; }
}
renderChips(); load();
</script>
</body>
</html>
